[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scoring-service"
version = "0.1.0"
description = "Packaged lead scoring inference service with MLflow and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pandas==3.0.2",
  "numpy==2.4.4",
  "scikit-learn==1.8.0",
  "lightgbm==4.6.0",
  "mlflow==3.10.1",
  "joblib>=1.3.0",
  "cloudpickle>=3.0.0",
  "pydantic>=2.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
