name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pandas numpy scikit-learn lightgbm xgboost statsmodels joblib cloudpickle mlflow optuna shap pytest pytest-cov fastapi uvicorn pydantic requests

      - name: Generate dataset
        run: python data/generate_dataset.py

      - name: Run pipeline
        run: python training_pipeline/pipelines/pipeline.py

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --tb=short

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            training_pipeline/models/lightgbm_best_model.pkl
            utils/processor.pkl
            training_pipeline/metrics/training_metrics.json
          retention-days: 1

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - name: Build Docker image
        run: docker build -t churn-api .

      - name: Verify container starts
        run: |
          docker run -d --name churn-api -p 8000:8000 churn-api
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy"
              docker stop churn-api
              exit 0
            fi
            echo "Waiting for API... attempt $i"
          done
          echo "API failed to start. Container logs:"
          docker logs churn-api
          exit 1
